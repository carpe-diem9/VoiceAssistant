<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 语音助理 - 麦克风授权</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #2c3e50;
      }
      .wrap {
        max-width: 640px; margin: 0 auto; padding: 48px 24px;
      }
      .card {
        background: #fff; border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,.18);
        padding: 40px 36px;
      }
      h1 {
        margin: 0 0 8px; font-size: 24px; font-weight: 700;
        display: flex; align-items: center; gap: 10px;
      }
      h1 .icon {
        display: inline-flex; width: 40px; height: 40px; border-radius: 10px;
        background: linear-gradient(135deg,#4f8cff,#6a6bff);
        color: #fff; align-items: center; justify-content: center; font-size: 22px;
      }
      p.sub { margin: 4px 0 24px; color: #5b6b7c; font-size: 14px; }
      .status {
        padding: 14px 16px; border-radius: 10px; margin: 16px 0 24px;
        font-size: 14px; font-weight: 500; line-height: 1.6;
        display: flex; align-items: flex-start; gap: 10px;
      }
      .status.pending { background: #fff8e6; color: #8a6d3b; }
      .status.ok { background: #e7f8ee; color: #1f7a3f; }
      .status.err { background: #fdeaea; color: #b42318; }
      .status .dot {
        width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: 0 0 10px;
      }
      .status.pending .dot { background: #e8a33d; animation: pulse 1.2s ease-in-out infinite; }
      .status.ok .dot { background: #2fa85a; }
      .status.err .dot { background: #e34b4b; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .35; }
      }
      .steps {
        background: #f6f8fb; border-radius: 10px; padding: 16px 20px;
        font-size: 14px; line-height: 1.8; color: #3c4858;
      }
      .steps b { color: #1a1f2e; }
      .btn-row { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
      button {
        font: inherit; cursor: pointer; border: none; border-radius: 8px;
        padding: 10px 20px; font-size: 14px; font-weight: 500;
        transition: all .15s;
      }
      button.primary {
        background: linear-gradient(135deg,#4f8cff,#6a6bff); color: #fff;
        box-shadow: 0 4px 12px rgba(79,140,255,.35);
      }
      button.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,140,255,.45); }
      button.ghost {
        background: #edf1f7; color: #3c4858;
      }
      button.ghost:hover { background: #dce4ef; }
      .hint { font-size: 12px; color: #8797a8; margin-top: 14px; }
      code {
        background: #eef2f7; padding: 2px 6px; border-radius: 4px;
        font-family: Menlo, Consolas, monospace; font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1><span class="icon">🎤</span>开启麦克风授权</h1>
        <p class="sub">为"AI 语音助理"扩展一次性授权麦克风，授权后所有扩展页面（弹窗/侧边栏/设置）均可语音输入。</p>

        <div id="status" class="status pending">
          <span class="dot"></span>
          <span id="statusText">正在向浏览器申请麦克风权限，请在弹出的对话框中点击<b>「允许」</b>…</span>
        </div>

        <div class="steps">
          <div><b>操作步骤：</b></div>
          <div>1. 浏览器顶部会弹出<b>"允许使用麦克风？"</b>对话框 → 点<b>「允许」</b>。</div>
          <div>2. 看到下方状态变为绿色"授权成功"即可关闭本页面。</div>
          <div>3. 回到扩展弹窗，再次点击麦克风按钮就能正常录音。</div>
        </div>

        <div class="btn-row">
          <button class="primary" id="btnRetry">重新申请权限</button>
          <button class="ghost" id="btnClose">关闭此页</button>
        </div>
        <div class="hint">若多次点击"重新申请"仍失败，请点击地址栏左侧的锁形图标 → 把"麦克风"改为"允许"，然后刷新本页。</div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
